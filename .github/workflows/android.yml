name: 路径
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y git unzip openjdk-17-jdk python3-pip autoconf libtool
          pip3 install buildozer cython==0.29.36

      - name: 编译APK
        run: buildozer android debug run: buildozer android debug


      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: bin/*.apk
